<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>usePasskeyFlow — Hook Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../dist/index.css">
  <style>
    /*
      Dark palette: burgundy-tinted darks per Quilibrium style guide.
      Backgrounds are very dark shades derived from burgundy (#40001b),
      not pure black or neutral grays.
    */
    :root {
      --bg-page:      #110810;
      --bg-surface:   #170d14;
      --bg-raised:    #1e1219;
      --bg-inset:     #231620;
      --border:       rgba(255, 230, 240, 0.10);
      --border-hi:    rgba(255, 230, 240, 0.18);
      --border-subtle:rgba(255, 230, 240, 0.05);

      --text:         #f0e9e4;
      --text-2:       rgba(240, 233, 228, 0.75);
      --text-3:       rgba(240, 233, 228, 0.50);
      --text-4:       rgba(240, 233, 228, 0.35);

      --pink:         #ff056d;
      --pink-dim:     rgba(255, 5, 109, 0.10);
      --green:        #34d97a;
      --green-dim:    rgba(52, 217, 122, 0.10);
      --red:          #f25c5c;
      --red-dim:      rgba(242, 92, 92, 0.10);
      --orange:       #ff8533;
      --orange-dim:   rgba(255, 133, 51, 0.08);
      --blue:         #4d9eff;
      --purple:       #9b6dff;

      --sans:         'Inter', system-ui, -apple-system, sans-serif;
      --code:         'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      --radius:       12px;
      --radius-sm:    8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      font-size: 14px;
      background: var(--bg-page);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- LOADING ---- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .loading-wordmark {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .loading-bar-wrap {
      width: 160px;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: var(--pink);
      border-radius: 1px;
      animation: loadbar 1.8s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes loadbar {
      0%   { transform: scaleX(0) translateX(0%); opacity: 1; }
      60%  { transform: scaleX(1) translateX(0%); opacity: 1; }
      100% { transform: scaleX(1) translateX(110%); opacity: 0; }
    }
    .loading-label {
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-3);
    }
    .loading-error {
      font-size: 0.9375rem;
      color: var(--red);
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
    }
    .loading-error code {
      display: block;
      margin-top: 8px;
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-2);
      background: var(--bg-raised);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
    }

    /* ---- SHELL ---- */
    .shell {
      display: grid;
      grid-template-rows: 52px 1fr;
      min-height: 100vh;
    }

    /* ---- TOPBAR ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-wordmark {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .topbar-sep { width: 1px; height: 18px; background: var(--border); }
    .topbar-title {
      font-size: 0.875rem;
      color: var(--text-3);
    }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-link {
      font-size: 0.8125rem;
      color: var(--pink);
      text-decoration: none;
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .topbar-link:hover {
      border-color: rgba(255, 5, 109, 0.3);
      background: var(--pink-dim);
    }
    .topbar-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      color: var(--text-3);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ---- MAIN ---- */
    .main {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: auto 1fr;
      gap: 0;
      padding: 28px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ---- STEP MACHINE ---- */
    .machine-wrap {
      grid-column: 1 / -1;
      margin-bottom: 24px;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }
    .machine {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      overflow-x: auto;
    }
    .machine-step {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }
    .machine-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: default;
    }
    .machine-node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-hi);
      transition: all 0.3s cubic-bezier(0, 0, 0.5, 1);
      flex-shrink: 0;
    }
    .machine-node-label {
      font-size: 0.8125rem;
      color: var(--text-4);
      white-space: nowrap;
      transition: color 0.3s cubic-bezier(0, 0, 0.5, 1);
    }
    .machine-node.active .machine-node-dot {
      background: var(--pink);
      box-shadow: 0 0 12px rgba(255, 5, 109, 0.4);
    }
    .machine-node.active .machine-node-label { color: var(--pink); font-weight: 500; }
    .machine-node.done .machine-node-dot { background: var(--green); }
    .machine-node.done .machine-node-label { color: var(--green); }
    .machine-node.error-node .machine-node-dot {
      background: var(--red);
      box-shadow: 0 0 10px rgba(242, 92, 92, 0.4);
    }
    .machine-node.error-node .machine-node-label { color: var(--red); }
    .machine-edge {
      width: 36px;
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
      position: relative;
      top: -9px;
      transition: background 0.3s;
    }
    .machine-edge.lit { background: var(--green); }

    /* ---- LEFT COL ---- */
    .left-col {
      padding-right: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- PANELS ---- */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* ---- STATE ROWS ---- */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border-subtle);
    }
    .state-cell {
      background: var(--bg-raised);
      padding: 12px 14px;
    }
    .state-cell-key {
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .state-cell-val {
      font-family: var(--code);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-2);
      word-break: break-all;
    }
    .state-cell-val.v-step   { color: var(--pink); }
    .state-cell-val.v-null   { color: var(--text-4); font-style: italic; }
    .state-cell-val.v-true   { color: var(--green); }
    .state-cell-val.v-false  { color: var(--red); }
    .state-cell-val.v-error  { color: var(--red); font-size: 0.875rem; }
    .state-cell-val.v-addr   { color: var(--blue); font-size: 0.875rem; }

    /* ---- LOG ---- */
    .log-list {
      font-family: var(--code);
      font-size: 0.8125rem;
      line-height: 1.6;
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-track { background: transparent; }
    .log-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
    .log-row {
      display: flex;
      gap: 12px;
      padding: 5px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: var(--bg-raised); }
    .log-ts { color: var(--text-4); flex-shrink: 0; }
    .log-msg.step-change { color: var(--blue); }
    .log-msg.err         { color: var(--red); }
    .log-msg.ok          { color: var(--green); }
    .log-msg.default     { color: var(--text-2); }
    .log-empty { padding: 20px 16px; color: var(--text-3); font-size: 0.875rem; font-style: italic; }

    /* ---- NOTICE ---- */
    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--orange-dim);
      border: 1px solid rgba(255, 133, 51, 0.18);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.875rem;
      color: var(--orange);
      line-height: 1.5;
    }
    .notice-icon { flex-shrink: 0; opacity: 0.8; margin-top: 2px; }

    /* ---- RIGHT COL (ACTIONS) ---- */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-2);
      font-family: var(--sans);
      font-size: 0.875rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0, 0, 0.5, 1);
      width: 100%;
    }
    .action-btn:hover:not(:disabled) {
      border-color: var(--border-hi);
      color: var(--text);
      background: var(--bg-raised);
    }
    .action-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }
    .action-btn .btn-accent {
      width: 3px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ab-primary .btn-accent  { background: var(--pink); }
    .ab-success .btn-accent  { background: var(--green); }
    .ab-warning .btn-accent  { background: var(--orange); }
    .ab-violet  .btn-accent  { background: var(--purple); }
    .ab-neutral .btn-accent  { background: var(--text-4); }
    .ab-danger  .btn-accent  { background: var(--red); }

    .ab-primary:hover:not(:disabled) { border-color: rgba(255, 5, 109, 0.3); }
    .ab-success:hover:not(:disabled) { border-color: rgba(52, 217, 122, 0.3); }
    .ab-warning:hover:not(:disabled) { border-color: rgba(255, 133, 51, 0.3); }
    .ab-violet:hover:not(:disabled)  { border-color: rgba(155, 109, 255, 0.3); }

    .action-btn-label { flex: 1; font-family: var(--code); font-size: 0.8125rem; }
    .action-btn-hint  { font-size: 0.8125rem; color: var(--text-4); margin-top: 2px; }

    .action-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 0;
    }

    .action-btn.ab-danger { color: var(--red); opacity: 0.55; }
    .action-btn.ab-danger:hover { opacity: 1; border-color: rgba(242, 92, 92, 0.3); background: var(--red-dim); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const LoadingScreen = ({ error }) => (
      <div className="loading-screen">
        <div className="loading-wordmark">Quilibrium SDK</div>
        {error ? (
          <div className="loading-error">
            Failed to load SDK module.
            <code>Run `yarn build` then refresh.</code>
          </div>
        ) : (
          <>
            <div className="loading-bar-wrap"><div className="loading-bar" /></div>
            <div className="loading-label">loading dist/index.esm.js</div>
          </>
        )}
      </div>
    );

    // --- Check result row ---
    const Check = ({ label, status, detail }) => {
      const color = status === 'pass' ? 'var(--green)' : status === 'fail' ? 'var(--red)' : 'var(--text-4)';
      const icon = status === 'pass' ? '\u2713' : status === 'fail' ? '\u2717' : '\u2022';
      return (
        <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '12px 0', borderBottom: '1px solid var(--border-subtle)' }}>
          <span style={{ color, fontSize: '1rem', fontWeight: 700, width: 18, textAlign: 'center', flexShrink: 0 }}>{icon}</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: '0.875rem', color: status === 'fail' ? 'var(--red)' : 'var(--text)', fontWeight: 500 }}>{label}</div>
            {detail && <div style={{ fontSize: '0.8125rem', color: 'var(--text-3)', marginTop: 3, lineHeight: 1.4 }}>{detail}</div>}
          </div>
        </div>
      );
    };

    // --- Diagnostics panel (runs checks on mount) ---
    const DiagnosticsPanel = () => {
      const [checks, setChecks] = useState([
        { id: 'sdk',     label: 'SDK module loaded',          status: 'pending', detail: null },
        { id: 'wasm',    label: 'WASM crypto backend',        status: 'pending', detail: null },
        { id: 'keygen',  label: 'Ed448 key generation',       status: 'pending', detail: null },
        { id: 'webauthn', label: 'WebAuthn API available',    status: 'pending', detail: null },
        { id: 'context', label: 'PasskeysProvider + usePasskeyFlow', status: 'pending', detail: null },
      ]);

      const update = (id, status, detail) => {
        setChecks(prev => prev.map(c => c.id === id ? { ...c, status, detail } : c));
      };

      useEffect(() => {
        const run = async () => {
          // 1. SDK
          const sdk = window.__SDK__;
          if (!sdk) { update('sdk', 'fail', 'window.__SDK__ not set. Run yarn build.'); return; }
          update('sdk', 'pass', 'dist/index.esm.js loaded successfully');

          // 2. WASM
          if (window.__WASM_OK__) {
            update('wasm', 'pass', 'channelwasm_bg.wasm initialized');
          } else {
            update('wasm', 'fail', 'WASM init failed. Make sure dist/channelwasm_bg.wasm exists (yarn build copies it).');
            // Continue checks anyway
          }

          // 3. Key generation
          try {
            const pair = sdk.channel_raw.js_generate_ed448();
            const parsed = JSON.parse(pair);
            if (parsed.public_key && parsed.private_key) {
              update('keygen', 'pass', `Generated Ed448 keypair (${parsed.public_key.length}-byte pubkey, ${parsed.private_key.length}-byte privkey)`);
            } else {
              update('keygen', 'fail', 'Key generated but missing expected fields');
            }
          } catch (e) {
            update('keygen', 'fail', e.message);
          }

          // 4. WebAuthn
          if (window.PublicKeyCredential) {
            update('webauthn', 'pass', 'navigator.credentials available. Note: actual prompts require HTTPS or a platform authenticator, which may not work on localhost.');
          } else {
            update('webauthn', 'fail', 'PublicKeyCredential not available in this browser');
          }

          // 5. Context (just checks the exports exist)
          if (sdk.PasskeysProvider && sdk.usePasskeyFlow && sdk.usePasskeysContext) {
            update('context', 'pass', 'All hook and context exports found in the SDK bundle');
          } else {
            update('context', 'fail', 'Missing exports: ' + [
              !sdk.PasskeysProvider && 'PasskeysProvider',
              !sdk.usePasskeyFlow && 'usePasskeyFlow',
              !sdk.usePasskeysContext && 'usePasskeysContext',
            ].filter(Boolean).join(', '));
          }
        };
        run();
      }, []);

      const passCount = checks.filter(c => c.status === 'pass').length;
      const failCount = checks.filter(c => c.status === 'fail').length;

      return (
        <div className="panel" style={{ marginBottom: 20 }}>
          <div className="panel-header">
            <span className="panel-title">SDK Diagnostics</span>
            <span style={{
              fontSize: '0.75rem', fontWeight: 600,
              color: failCount === 0 ? 'var(--green)' : 'var(--text-3)',
            }}>
              {passCount}/{checks.length} passed
            </span>
          </div>
          <div style={{ padding: '4px 16px' }}>
            {checks.map(c => <Check key={c.id} {...c} />)}
          </div>
        </div>
      );
    };

    // --- Hook state inspector (stable top-level component) ---
    const HookInspector = () => {
      const { usePasskeyFlow, usePasskeysContext } = window.__SDK__;
      const { setShowPasskeyPrompt, showPasskeyPrompt } = usePasskeysContext();
      const [log, setLog] = useState([]);
      const logEndRef = useRef(null);

      const addLog = useCallback((type, msg) => {
        const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
        setLog(prev => [...prev.slice(-29), { ts, type, msg }]);
      }, []);

      useEffect(() => {
        logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [log]);

      const mockGetUserReg = useCallback(async (addr) => ({ address: addr, registrations: [] }), []);
      const mockUploadReg = useCallback(async () => {}, []);

      // Stable refs for callbacks
      const refs = useRef({});
      refs.current.onStep = (step) => addLog('step-change', `step \u2192 ${step}`);
      refs.current.onComplete = () => addLog('ok', 'onComplete');
      refs.current.onError = (err) => addLog('err', `${err.code}: ${err.rawMessage || '(no message)'}`);
      refs.current.onCancel = () => addLog('ok', 'onCancel');

      const hook = usePasskeyFlow({
        fqAppPrefix: 'HOOK-TEST',
        getUserRegistration: mockGetUserReg,
        uploadRegistration: mockUploadReg,
        onStepChange: useCallback((s) => refs.current.onStep(s), []),
        onComplete:   useCallback(()  => refs.current.onComplete(), []),
        onError:      useCallback((e) => refs.current.onError(e), []),
        onCancel:     useCallback(()  => refs.current.onCancel(), []),
      });

      const ensureOpen = useCallback((importMode) => {
        return new Promise(resolve => {
          setShowPasskeyPrompt({ value: true, importMode: importMode ?? false });
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }, [setShowPasskeyPrompt]);

      // Flow steps for visualization
      const STEPS = ['idle', 'ready', 'registering', 'awaiting_completion', 'completing', 'success'];
      const BRANCH = { importing: 1, ready_with_keypair: 1, fallback_registering: 2 };
      const isMain = STEPS.includes(hook.step);
      const stepIdx = isMain ? STEPS.indexOf(hook.step) : (BRANCH[hook.step] ?? -1);
      const isError = hook.step === 'error';
      const isBranch = !isMain && !isError;

      return (
        <>
          {/* State machine */}
          <div className="panel" style={{ marginBottom: 20 }}>
            <div className="panel-header"><span className="panel-title">State machine</span></div>
            <div style={{ padding: '18px 24px', display: 'flex', alignItems: 'center', overflowX: 'auto', gap: 0 }}>
              {STEPS.map((step, i) => {
                const isActive = step === hook.step || (isBranch && i === stepIdx);
                const isDone = stepIdx > i && stepIdx !== -1 && !isError;
                return (
                  <div className="machine-step" key={step}>
                    <div className={`machine-node ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`}>
                      <div className="machine-node-dot" />
                      <div className="machine-node-label">{isBranch && i === stepIdx ? hook.step : step}</div>
                    </div>
                    {i < STEPS.length - 1 && <div className={`machine-edge ${isDone ? 'lit' : ''}`} />}
                  </div>
                );
              })}
              {isError && (
                <>
                  <div className="machine-edge" />
                  <div className="machine-node error-node">
                    <div className="machine-node-dot" />
                    <div className="machine-node-label">error</div>
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Two columns: current state + actions */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
            {/* Left: live state */}
            <div>
              <div className="panel" style={{ marginBottom: 20 }}>
                <div className="panel-header"><span className="panel-title">Live hook state</span></div>
                <div style={{ padding: '4px 16px' }}>
                  {[
                    ['step',     hook.step,              hook.step === 'error' ? 'var(--red)' : 'var(--pink)'],
                    ['address',  hook.address ? hook.address.slice(0,20) + '...' : 'null', hook.address ? 'var(--blue)' : 'var(--text-4)'],
                    ['canRetry', String(hook.canRetry),  hook.canRetry ? 'var(--green)' : 'var(--text-4)'],
                    ['error',    hook.error ? `${hook.error.code}: ${hook.error.rawMessage || ''}` : 'none', hook.error ? 'var(--red)' : 'var(--text-4)'],
                  ].map(([k, v, color]) => (
                    <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid var(--border-subtle)', fontSize: '0.875rem' }}>
                      <span style={{ color: 'var(--text-3)' }}>{k}</span>
                      <span style={{ color, fontFamily: 'var(--code)', fontWeight: 500 }}>{v}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Event log */}
              <div className="panel">
                <div className="panel-header">
                  <span className="panel-title">Event log</span>
                  <button onClick={() => setLog([])} style={{
                    background: 'var(--bg-raised)', border: '1px solid var(--border)',
                    borderRadius: 'var(--radius-sm)', color: 'var(--text-3)',
                    fontFamily: 'var(--sans)', fontSize: '0.75rem', cursor: 'pointer',
                    letterSpacing: '0.04em', textTransform: 'uppercase',
                    fontWeight: 600, padding: '4px 10px',
                  }}>clear</button>
                </div>
                <div className="log-list">
                  {log.length === 0
                    ? <div className="log-empty">Events appear here when you trigger actions.</div>
                    : log.map((entry, i) => (
                        <div className="log-row" key={i}>
                          <span className="log-ts">{entry.ts}</span>
                          <span className={`log-msg ${entry.type}`}>{entry.msg}</span>
                        </div>
                      ))
                  }
                  <div ref={logEndRef} />
                </div>
              </div>
            </div>

            {/* Right: actions with explanations */}
            <div>
              <div className="panel">
                <div className="panel-header"><span className="panel-title">Try these actions</span></div>
                <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 6 }}>

                  <div className="notice" style={{ marginBottom: 6 }}>
                    <span className="notice-icon">!</span>
                    <span>
                      Actions will transition the state machine and then fail with an error
                      (crypto polyfill limitation in the browser). This is normal. The diagnostics
                      above confirm the SDK internals work. Full end-to-end flows require the real
                      app on HTTPS.
                    </span>
                  </div>

                  <div style={{ fontSize: '0.8125rem', color: 'var(--text-3)', marginBottom: 4 }}>
                    Each button calls a hook method. Watch the state machine and event log on the left.
                  </div>

                  <button className="action-btn ab-primary" onClick={async () => { await ensureOpen(false); hook.startRegistration(); }}>
                    <div className="btn-accent" />
                    <div>
                      <div className="action-btn-label">startRegistration()</div>
                      <div className="action-btn-hint">Generates a key, then asks the browser to create a passkey. Will fail on localhost without HTTPS.</div>
                    </div>
                  </button>

                  <button className="action-btn ab-success" onClick={() => hook.completeRegistration()} disabled={hook.step !== 'awaiting_completion'}>
                    <div className="btn-accent" />
                    <div>
                      <div className="action-btn-label">completeRegistration()</div>
                      <div className="action-btn-hint">Second step after startRegistration succeeds. Writes the key into the passkey.</div>
                    </div>
                  </button>

                  <button className="action-btn ab-warning" onClick={async () => { await ensureOpen(false); hook.proceedWithoutPasskey(); }}>
                    <div className="btn-accent" />
                    <div>
                      <div className="action-btn-label">proceedWithoutPasskey()</div>
                      <div className="action-btn-hint">Skips passkeys entirely, stores the key in IndexedDB. Will also fail here due to crypto polyfill limitation.</div>
                    </div>
                  </button>

                  <div className="action-divider" />

                  <button className="action-btn ab-neutral" onClick={() => hook.retry()} disabled={!hook.canRetry}>
                    <div className="btn-accent" />
                    <div>
                      <div className="action-btn-label">retry()</div>
                      <div className="action-btn-hint">Re-attempt after an error. Only works when canRetry is true.</div>
                    </div>
                  </button>

                  <button className="action-btn ab-neutral" onClick={() => { hook.cancel(); setLog([]); }}>
                    <div className="btn-accent" />
                    <div>
                      <div className="action-btn-label">cancel() + reset log</div>
                      <div className="action-btn-hint">Reset everything back to idle and clear the log.</div>
                    </div>
                  </button>

                  <div className="action-divider" />

                  <a href="index.html" className="action-btn ab-primary" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', gap: '8px', marginTop: 4 }}>
                    <div className="btn-accent" />
                    <span className="action-btn-label" style={{ fontFamily: 'var(--sans)' }}>PasskeyModal test (visual UI states)</span>
                    <span style={{ color: 'var(--text-4)', fontSize: '0.875rem' }}>&rarr;</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </>
      );
    };

    // --- App shell ---
    const App = () => {
      const [sdkReady, setSdkReady] = useState(false);
      const [sdkError, setSdkError] = useState(false);

      useEffect(() => {
        let attempts = 0;
        const interval = setInterval(() => {
          if (window.__SDK__) { setSdkReady(true); clearInterval(interval); }
          else if (window.__SDK_ERROR__ || ++attempts > 80) { setSdkError(true); clearInterval(interval); }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      if (!sdkReady) return <LoadingScreen error={sdkError} />;

      const { PasskeysProvider } = window.__SDK__;

      return (
        <PasskeysProvider fqAppPrefix="HOOK-TEST">
          <div className="shell">
            <header className="topbar">
              <span className="topbar-wordmark">Quilibrium</span>
              <div className="topbar-sep" />
              <span className="topbar-title">SDK Health Check + Hook Inspector</span>
              <div className="topbar-right">
                <a className="topbar-link" href="index.html">modal test</a>
                <div className="topbar-dot">
                  <div className="dot" style={window.__WASM_OK__ === false ? { background: 'var(--red)', boxShadow: '0 0 6px var(--red)' } : {}} />
                  <span>{window.__WASM_OK__ ? 'SDK + WASM ready' : window.__WASM_OK__ === false ? 'WASM failed' : 'loading'}</span>
                </div>
              </div>
            </header>
            <div style={{ padding: 28, maxWidth: 1100, margin: '0 auto', width: '100%' }}>
              <DiagnosticsPanel />
              <HookInspector />
            </div>
          </div>
        </PasskeysProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script type="importmap">
  {
    "imports": {
      "buffer":          "https://esm.sh/buffer@6?bundle",
      "crypto":          "https://esm.sh/crypto-browserify@3?bundle",
      "react":           "./shims/react.js",
      "react-dom":       "./shims/react-dom.js",
      "react-dropzone":  "https://esm.sh/react-dropzone@14?external=react&bundle"
    }
  }
  </script>
  <script type="module">
    import('../dist/index.esm.js')
      .then(async sdk => {
        try {
          await sdk.channel_raw.default();
          window.__WASM_OK__ = true;
        } catch (e) {
          console.warn('WASM init failed (crypto actions will not work):', e.message);
          window.__WASM_OK__ = false;
        }
        window.__SDK__ = sdk;
      })
      .catch(err => { console.error('SDK load failed:', err); window.__SDK_ERROR__ = true; });
  </script>
</body>
</html>
