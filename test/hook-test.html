<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>usePasskeyFlow — Hook Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../dist/index.css">
  <style>
    /*
      Dark palette: burgundy-tinted darks per Quilibrium style guide.
      Backgrounds are very dark shades derived from burgundy (#40001b),
      not pure black or neutral grays.
    */
    :root {
      --bg-page:      #110810;
      --bg-surface:   #170d14;
      --bg-raised:    #1e1219;
      --bg-inset:     #231620;
      --border:       rgba(255, 230, 240, 0.10);
      --border-hi:    rgba(255, 230, 240, 0.18);
      --border-subtle:rgba(255, 230, 240, 0.05);

      --text:         #f0e9e4;
      --text-2:       rgba(240, 233, 228, 0.75);
      --text-3:       rgba(240, 233, 228, 0.50);
      --text-4:       rgba(240, 233, 228, 0.35);

      --pink:         #ff056d;
      --pink-dim:     rgba(255, 5, 109, 0.10);
      --green:        #34d97a;
      --green-dim:    rgba(52, 217, 122, 0.10);
      --red:          #f25c5c;
      --red-dim:      rgba(242, 92, 92, 0.10);
      --orange:       #ff8533;
      --orange-dim:   rgba(255, 133, 51, 0.08);
      --blue:         #4d9eff;
      --purple:       #9b6dff;

      --sans:         'Inter', system-ui, -apple-system, sans-serif;
      --code:         'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      --radius:       12px;
      --radius-sm:    8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      font-size: 14px;
      background: var(--bg-page);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- LOADING ---- */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .loading-wordmark {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .loading-bar-wrap {
      width: 160px;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: var(--pink);
      border-radius: 1px;
      animation: loadbar 1.8s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes loadbar {
      0%   { transform: scaleX(0) translateX(0%); opacity: 1; }
      60%  { transform: scaleX(1) translateX(0%); opacity: 1; }
      100% { transform: scaleX(1) translateX(110%); opacity: 0; }
    }
    .loading-label {
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-3);
    }
    .loading-error {
      font-size: 0.9375rem;
      color: var(--red);
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
    }
    .loading-error code {
      display: block;
      margin-top: 8px;
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-2);
      background: var(--bg-raised);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
    }

    /* ---- SHELL ---- */
    .shell {
      display: grid;
      grid-template-rows: 52px 1fr;
      min-height: 100vh;
    }

    /* ---- TOPBAR ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-wordmark {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .topbar-sep { width: 1px; height: 18px; background: var(--border); }
    .topbar-title {
      font-size: 0.875rem;
      color: var(--text-3);
    }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-link {
      font-size: 0.8125rem;
      color: var(--pink);
      text-decoration: none;
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .topbar-link:hover {
      border-color: rgba(255, 5, 109, 0.3);
      background: var(--pink-dim);
    }
    .topbar-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      color: var(--text-3);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ---- MAIN ---- */
    .main {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: auto 1fr;
      gap: 0;
      padding: 28px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ---- STEP MACHINE ---- */
    .machine-wrap {
      grid-column: 1 / -1;
      margin-bottom: 24px;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }
    .machine {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      overflow-x: auto;
    }
    .machine-step {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
    }
    .machine-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: default;
    }
    .machine-node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-hi);
      transition: all 0.3s cubic-bezier(0, 0, 0.5, 1);
      flex-shrink: 0;
    }
    .machine-node-label {
      font-size: 0.8125rem;
      color: var(--text-4);
      white-space: nowrap;
      transition: color 0.3s cubic-bezier(0, 0, 0.5, 1);
    }
    .machine-node.active .machine-node-dot {
      background: var(--pink);
      box-shadow: 0 0 12px rgba(255, 5, 109, 0.4);
    }
    .machine-node.active .machine-node-label { color: var(--pink); font-weight: 500; }
    .machine-node.done .machine-node-dot { background: var(--green); }
    .machine-node.done .machine-node-label { color: var(--green); }
    .machine-node.error-node .machine-node-dot {
      background: var(--red);
      box-shadow: 0 0 10px rgba(242, 92, 92, 0.4);
    }
    .machine-node.error-node .machine-node-label { color: var(--red); }
    .machine-edge {
      width: 36px;
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
      position: relative;
      top: -9px;
      transition: background 0.3s;
    }
    .machine-edge.lit { background: var(--green); }

    /* ---- LEFT COL ---- */
    .left-col {
      padding-right: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- PANELS ---- */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* ---- STATE ROWS ---- */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border-subtle);
    }
    .state-cell {
      background: var(--bg-raised);
      padding: 12px 14px;
    }
    .state-cell-key {
      font-family: var(--code);
      font-size: 0.8125rem;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .state-cell-val {
      font-family: var(--code);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text-2);
      word-break: break-all;
    }
    .state-cell-val.v-step   { color: var(--pink); }
    .state-cell-val.v-null   { color: var(--text-4); font-style: italic; }
    .state-cell-val.v-true   { color: var(--green); }
    .state-cell-val.v-false  { color: var(--red); }
    .state-cell-val.v-error  { color: var(--red); font-size: 0.875rem; }
    .state-cell-val.v-addr   { color: var(--blue); font-size: 0.875rem; }

    /* ---- LOG ---- */
    .log-list {
      font-family: var(--code);
      font-size: 0.8125rem;
      line-height: 1.6;
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-track { background: transparent; }
    .log-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
    .log-row {
      display: flex;
      gap: 12px;
      padding: 5px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }
    .log-row:last-child { border-bottom: none; }
    .log-row:hover { background: var(--bg-raised); }
    .log-ts { color: var(--text-4); flex-shrink: 0; }
    .log-msg.step-change { color: var(--blue); }
    .log-msg.err         { color: var(--red); }
    .log-msg.ok          { color: var(--green); }
    .log-msg.default     { color: var(--text-2); }
    .log-empty { padding: 20px 16px; color: var(--text-3); font-size: 0.875rem; font-style: italic; }

    /* ---- NOTICE ---- */
    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--orange-dim);
      border: 1px solid rgba(255, 133, 51, 0.18);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.875rem;
      color: var(--orange);
      line-height: 1.5;
    }
    .notice-icon { flex-shrink: 0; opacity: 0.8; margin-top: 2px; }

    /* ---- RIGHT COL (ACTIONS) ---- */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-2);
      font-family: var(--sans);
      font-size: 0.875rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0, 0, 0.5, 1);
      width: 100%;
    }
    .action-btn:hover:not(:disabled) {
      border-color: var(--border-hi);
      color: var(--text);
      background: var(--bg-raised);
    }
    .action-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }
    .action-btn .btn-accent {
      width: 3px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ab-primary .btn-accent  { background: var(--pink); }
    .ab-success .btn-accent  { background: var(--green); }
    .ab-warning .btn-accent  { background: var(--orange); }
    .ab-violet  .btn-accent  { background: var(--purple); }
    .ab-neutral .btn-accent  { background: var(--text-4); }
    .ab-danger  .btn-accent  { background: var(--red); }

    .ab-primary:hover:not(:disabled) { border-color: rgba(255, 5, 109, 0.3); }
    .ab-success:hover:not(:disabled) { border-color: rgba(52, 217, 122, 0.3); }
    .ab-warning:hover:not(:disabled) { border-color: rgba(255, 133, 51, 0.3); }
    .ab-violet:hover:not(:disabled)  { border-color: rgba(155, 109, 255, 0.3); }

    .action-btn-label { flex: 1; font-family: var(--code); font-size: 0.8125rem; }
    .action-btn-hint  { font-size: 0.8125rem; color: var(--text-4); margin-top: 2px; }

    .action-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 0;
    }

    .action-btn.ab-danger { color: var(--red); opacity: 0.55; }
    .action-btn.ab-danger:hover { opacity: 1; border-color: rgba(242, 92, 92, 0.3); background: var(--red-dim); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // Real step names from PasskeyFlowStep type
    const STEPS = ['idle', 'ready', 'registering', 'awaiting_completion', 'completing', 'success'];
    const BRANCH_MAP = { importing: 1, ready_with_keypair: 1, fallback_registering: 2 };

    const LoadingScreen = ({ error }) => (
      <div className="loading-screen">
        <div className="loading-wordmark">Quilibrium SDK</div>
        {error ? (
          <div className="loading-error">
            Failed to load SDK module.
            <code>Run `yarn build` then refresh.</code>
          </div>
        ) : (
          <>
            <div className="loading-bar-wrap"><div className="loading-bar" /></div>
            <div className="loading-label">loading dist/index.esm.js</div>
          </>
        )}
      </div>
    );

    const StepMachine = ({ currentStep }) => {
      const isMainStep = STEPS.includes(currentStep);
      const stepIdx = isMainStep ? STEPS.indexOf(currentStep) : (BRANCH_MAP[currentStep] ?? -1);
      const isError = currentStep === 'error';
      const isBranch = !isMainStep && !isError;

      return (
        <div className="machine-wrap">
          <div className="section-label" style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
            <span>State machine</span>
            <span style={{
              fontSize: '0.75rem', fontWeight: 500, letterSpacing: '0.04em',
              color: window.__WASM_OK__ ? 'var(--green)' : window.__WASM_OK__ === false ? 'var(--red)' : 'var(--text-4)',
            }}>
              {window.__WASM_OK__ ? 'WASM ready' : window.__WASM_OK__ === false ? 'WASM failed' : 'WASM loading'}
            </span>
          </div>
          <div className="machine">
            {STEPS.map((step, i) => {
              const isActive = step === currentStep || (isBranch && i === stepIdx);
              const isDone = stepIdx > i && stepIdx !== -1 && !isError;
              return (
                <div className="machine-step" key={step}>
                  <div className={`machine-node ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`}>
                    <div className="machine-node-dot" />
                    <div className="machine-node-label">{isBranch && i === stepIdx ? currentStep : step}</div>
                  </div>
                  {i < STEPS.length - 1 && <div className={`machine-edge ${isDone ? 'lit' : ''}`} />}
                </div>
              );
            })}
            {isError && (
              <>
                <div className="machine-edge" />
                <div className="machine-node error-node">
                  <div className="machine-node-dot" />
                  <div className="machine-node-label">error</div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // This is the actual hook tester. It MUST be a stable component (not defined
    // inside another component's render) to avoid remounting on every parent render.
    // It accesses window.__SDK__ directly since it only renders after SDK is loaded.
    const FlowTester = () => {
      const { usePasskeyFlow, usePasskeysContext } = window.__SDK__;
      const { setShowPasskeyPrompt, showPasskeyPrompt } = usePasskeysContext();
      const fileInputRef = useRef(null);
      const [log, setLog] = useState([]);
      const logEndRef = useRef(null);

      const addLog = useCallback((type, msg) => {
        const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
        setLog(prev => [...prev.slice(-49), { ts, type, msg }]);
      }, []);

      useEffect(() => {
        logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [log]);

      // Stable callbacks - never change, so usePasskeyFlow won't re-init
      const mockGetUserRegistration = useCallback(async (address) => {
        addLog('ok', `getUserRegistration(${address.slice(0,12)}...)`);
        return { address, registrations: [] };
      }, [addLog]);

      const mockUploadRegistration = useCallback(async ({ address }) => {
        addLog('ok', `uploadRegistration(${address.slice(0,12)}...)`);
      }, [addLog]);

      // Stable callback refs for event handlers to avoid re-creating the hook
      const onStepChangeRef = useRef(null);
      const onCompleteRef = useRef(null);
      const onErrorRef = useRef(null);
      const onCancelRef = useRef(null);
      onStepChangeRef.current = (step) => addLog('step-change', `step \u2192 ${step}`);
      onCompleteRef.current = () => addLog('ok', 'onComplete fired');
      onErrorRef.current = (err) => addLog('err', `onError: ${err.code}${err.rawMessage ? ' / ' + err.rawMessage : ''}`);
      onCancelRef.current = () => addLog('ok', 'onCancel fired');

      const hook = usePasskeyFlow({
        fqAppPrefix: 'HOOK-TEST',
        getUserRegistration: mockGetUserRegistration,
        uploadRegistration: mockUploadRegistration,
        onStepChange: useCallback((s) => onStepChangeRef.current?.(s), []),
        onComplete:   useCallback(()  => onCompleteRef.current?.(), []),
        onError:      useCallback((e) => onErrorRef.current?.(e), []),
        onCancel:     useCallback(()  => onCancelRef.current?.(), []),
      });

      const ensureOpen = useCallback((importMode) => {
        return new Promise(resolve => {
          setShowPasskeyPrompt({ value: true, importMode: importMode ?? false });
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }, [setShowPasskeyPrompt]);

      const handleFileImport = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          addLog('ok', `importKeyFile: ${file.name}`);
          hook.importKeyFile(file);
        }
      };

      const valClass = (k, v) => {
        if (v === null || v === undefined) return 'v-null';
        if (k === 'step') return 'v-step';
        if (k === 'address') return 'v-addr';
        if (k.startsWith('error')) return v ? 'v-error' : 'v-null';
        if (typeof v === 'boolean') return v ? 'v-true' : 'v-false';
        return '';
      };
      const valDisplay = (k, v) => {
        if (v === null || v === undefined) return 'null';
        if (k === 'address' && typeof v === 'string') return v.slice(0,18) + '...';
        return String(v);
      };

      const stateFields = [
        ['step',              hook.step],
        ['promptActive',      showPasskeyPrompt.value],
        ['isPasskeySupported', hook.isPasskeySupported],
        ['isImportMode',      hook.isImportMode],
        ['canRetry',          hook.canRetry],
        ['error.code',        hook.error?.code ?? null],
        ['error.rawMessage',  hook.error?.rawMessage ?? null],
        ['address',           hook.address ?? null],
      ];

      return (
        <div className="main">
          <StepMachine currentStep={hook.step} />

          <div className="left-col">
            <div className="panel">
              <div className="panel-header"><span className="panel-title">Hook state</span></div>
              <div className="state-grid">
                {stateFields.map(([k, v]) => (
                  <div className="state-cell" key={k}>
                    <div className="state-cell-key">{k}</div>
                    <div className={`state-cell-val ${valClass(k, v)}`}>{valDisplay(k, v)}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="notice">
              <span className="notice-icon">!</span>
              <span>
                This is a two-step flow. <strong>startRegistration</strong> creates
                a passkey credential (first browser prompt), then <strong>completeRegistration</strong> writes
                the encryption key into it (second prompt). Both require localhost or HTTPS.
                WebAuthn may not work on <code>http://localhost</code> on Windows without Windows Hello.
                Use <strong>proceedWithoutPasskey</strong> to test the fallback path.
              </span>
            </div>

            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">Event log</span>
                <button
                  onClick={() => setLog([])}
                  style={{
                    background: 'var(--bg-raised)', border: '1px solid var(--border)',
                    borderRadius: 'var(--radius-sm)', color: 'var(--text-3)',
                    fontFamily: 'var(--sans)', fontSize: '0.75rem', cursor: 'pointer',
                    letterSpacing: '0.04em', textTransform: 'uppercase',
                    fontWeight: 600, padding: '4px 10px',
                  }}
                >
                  clear
                </button>
              </div>
              <div className="log-list">
                {log.length === 0
                  ? <div className="log-empty">No events yet. Trigger an action.</div>
                  : log.map((entry, i) => (
                      <div className="log-row" key={i}>
                        <span className="log-ts">{entry.ts}</span>
                        <span className={`log-msg ${entry.type}`}>{entry.msg}</span>
                      </div>
                    ))
                }
                <div ref={logEndRef} />
              </div>
            </div>
          </div>

          <div className="right-col">
            <div className="panel">
              <div className="panel-header"><span className="panel-title">Actions</span></div>
              <div className="action-list">
                <button className="action-btn ab-primary" onClick={async () => { await ensureOpen(false); hook.startRegistration(); }}>
                  <div className="btn-accent" />
                  <div>
                    <div className="action-btn-label">startRegistration()</div>
                    <div className="action-btn-hint">Step 1: creates passkey credential</div>
                  </div>
                </button>
                <button className="action-btn ab-success" onClick={() => hook.completeRegistration()} disabled={hook.step !== 'awaiting_completion'}>
                  <div className="btn-accent" />
                  <div>
                    <div className="action-btn-label">completeRegistration()</div>
                    <div className="action-btn-hint">Step 2: writes key into passkey (requires: awaiting_completion)</div>
                  </div>
                </button>
                <button className="action-btn ab-warning" onClick={async () => { await ensureOpen(false); hook.proceedWithoutPasskey(); }}>
                  <div className="btn-accent" />
                  <div>
                    <div className="action-btn-label">proceedWithoutPasskey()</div>
                    <div className="action-btn-hint">Fallback: stores key in IndexedDB (no authenticator needed)</div>
                  </div>
                </button>
                <button className="action-btn ab-violet" onClick={async () => { await ensureOpen(true); fileInputRef.current?.click(); }}>
                  <div className="btn-accent" />
                  <div>
                    <div className="action-btn-label">importKeyFile()</div>
                    <div className="action-btn-hint">Import a .key file, then startRegistration</div>
                  </div>
                </button>
                <input ref={fileInputRef} type="file" accept=".key" style={{ display: 'none' }} onChange={handleFileImport} />
                <div className="action-divider" />
                <button className="action-btn ab-neutral" onClick={() => hook.retry()} disabled={!hook.canRetry}>
                  <div className="btn-accent" />
                  <div>
                    <div className="action-btn-label">retry()</div>
                    <div className="action-btn-hint">requires: canRetry</div>
                  </div>
                </button>
                <button className="action-btn ab-neutral" onClick={() => hook.cancel()}>
                  <div className="btn-accent" />
                  <div className="action-btn-label">cancel()</div>
                </button>
                <button className="action-btn ab-neutral" onClick={() => hook.dismiss()}>
                  <div className="btn-accent" />
                  <div className="action-btn-label">dismiss()</div>
                </button>
              </div>
            </div>

            <div className="panel">
              <div className="panel-header"><span className="panel-title">Navigation</span></div>
              <div style={{ padding: '12px' }}>
                <a href="index.html" className="action-btn ab-primary" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <div className="btn-accent" />
                  <span className="action-btn-label" style={{ fontFamily: 'var(--sans)' }}>PasskeyModal test</span>
                  <span style={{ color: 'var(--text-4)', fontSize: '0.875rem' }}>&rarr;</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Outer shell: waits for SDK, then renders FlowTester inside PasskeysProvider.
    // FlowTester is a STABLE top-level component, never redefined.
    const App = () => {
      const [sdkReady, setSdkReady] = useState(false);
      const [sdkError, setSdkError] = useState(false);

      useEffect(() => {
        let attempts = 0;
        const interval = setInterval(() => {
          if (window.__SDK__) {
            setSdkReady(true);
            clearInterval(interval);
          } else if (window.__SDK_ERROR__ || ++attempts > 80) {
            setSdkError(true);
            clearInterval(interval);
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      if (!sdkReady) return <LoadingScreen error={sdkError} />;

      const { PasskeysProvider } = window.__SDK__;

      return (
        <PasskeysProvider fqAppPrefix="HOOK-TEST">
          <div className="shell">
            <header className="topbar">
              <span className="topbar-wordmark">Quilibrium</span>
              <div className="topbar-sep" />
              <span className="topbar-title">usePasskeyFlow / hook inspector</span>
              <div className="topbar-right">
                <a className="topbar-link" href="index.html">modal test</a>
                <div className="topbar-dot">
                  <div className="dot" style={window.__WASM_OK__ === false ? { background: 'var(--red)', boxShadow: '0 0 6px var(--red)' } : {}} />
                  <span>{window.__WASM_OK__ ? 'SDK + WASM ready' : window.__WASM_OK__ === false ? 'WASM failed' : 'SDK ready'}</span>
                </div>
              </div>
            </header>
            <FlowTester />
          </div>
        </PasskeysProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script type="importmap">
  {
    "imports": {
      "buffer":          "https://esm.sh/buffer@6?bundle",
      "crypto":          "https://esm.sh/crypto-browserify@3?bundle",
      "react":           "./shims/react.js",
      "react-dom":       "./shims/react-dom.js",
      "react-dropzone":  "https://esm.sh/react-dropzone@14?external=react&bundle"
    }
  }
  </script>
  <script type="module">
    import('../dist/index.esm.js')
      .then(async sdk => {
        try {
          await sdk.channel_raw.default();
          window.__WASM_OK__ = true;
        } catch (e) {
          console.warn('WASM init failed (crypto actions will not work):', e.message);
          window.__WASM_OK__ = false;
        }
        window.__SDK__ = sdk;
      })
      .catch(err => { console.error('SDK load failed:', err); window.__SDK_ERROR__ = true; });
  </script>
</body>
</html>
