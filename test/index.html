<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasskeyModal Visual Test</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../dist/index.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      z-index: 10001;
      min-width: 180px;
    }
    .control-panel h3 { margin: 0 0 14px 0; font-size: 1rem; font-weight: 600; }
    .control-panel button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .control-panel button:hover { background: #2563eb; }
    .control-panel button:last-child { margin-bottom: 0; }
    .status {
      margin-top: 14px;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #374151;
      font-family: monospace;
    }
    .hero {
      padding-top: 120px;
      text-align: center;
      color: white;
    }
    .hero h1 { font-size: 1.8rem; margin: 0 0 10px 0; }
    .hero p { font-size: 1rem; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const ModalTestApp = () => {
      const [sdkReady, setSdkReady] = useState(false);

      useEffect(() => {
        const interval = setInterval(() => {
          if (window.__SDK__) { setSdkReady(true); clearInterval(interval); }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      if (!sdkReady) {
        return (
          <div style={{ padding: 40, textAlign: 'center', color: 'white' }}>
            <p>Loading SDK from <code>../dist/index.esm.js</code>...</p>
            <p style={{ fontSize: '0.85rem', opacity: 0.7 }}>Run <code>yarn build</code> if this persists.</p>
          </div>
        );
      }

      const { PasskeysProvider, usePasskeysContext, PasskeyModal } = window.__SDK__;

      const ControlPanel = () => {
        const ctx = usePasskeysContext();
        const { showPasskeyPrompt, setShowPasskeyPrompt } = ctx;

        return (
          <div className="control-panel">
            <h3>PasskeyModal Tests</h3>
            <button onClick={() => setShowPasskeyPrompt({ value: true, importMode: false })}>
              Show Create Modal
            </button>
            <button onClick={() => setShowPasskeyPrompt({ value: true, importMode: true })}>
              Show Import Modal
            </button>
            <button onClick={() => setShowPasskeyPrompt({ value: false, importMode: false })}>
              Hide Modal
            </button>
            <hr style={{ border: 'none', borderTop: '1px solid #e5e7eb', margin: '8px 0' }} />
            <small style={{ color: '#6b7280', display: 'block', marginBottom: 6 }}>Force state (no auth needed)</small>
            <button
              style={{ background: '#059669' }}
              onClick={() => {
                ctx.setPasskeyRegistrationComplete(true);
                ctx.setPasskeyRegistrationError(undefined);
                setShowPasskeyPrompt({ value: true, importMode: false });
              }}
            >
              Force Success State
            </button>
            <button
              style={{ background: '#dc2626' }}
              onClick={() => {
                ctx.setPasskeyRegistrationComplete(false);
                ctx.setPasskeyRegistrationError('Simulated error: NotAllowedError -- The operation either timed out or was not allowed.');
                setShowPasskeyPrompt({ value: true, importMode: false });
              }}
            >
              Force Error State
            </button>
            <div className="status">
              <div>visible: {String(showPasskeyPrompt.value)}</div>
              <div>importMode: {String(showPasskeyPrompt.importMode)}</div>
              <div>complete: {String(ctx.passkeyRegistrationComplete)}</div>
              <div>error: {ctx.passkeyRegistrationError ? 'yes' : 'none'}</div>
            </div>
          </div>
        );
      };

      const mockGetUserRegistration = useCallback(async (address) => {
        return { address, registrations: [] };
      }, []);

      const mockUploadRegistration = useCallback(async () => {
        // no-op
      }, []);

      return (
        <PasskeysProvider fqAppPrefix="MODAL-TEST">
          <ControlPanel />
          <PasskeyModal
            fqAppPrefix="MODAL-TEST"
            getUserRegistration={mockGetUserRegistration}
            uploadRegistration={mockUploadRegistration}
          />
          <div className="hero">
            <h1>PasskeyModal Visual Test</h1>
            <p>Use the control panel to open the modal and test flows end-to-end.</p>
          </div>
        </PasskeysProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ModalTestApp />);
  </script>

  <script type="module">
    import * as SDK from '../dist/index.esm.js';
    window.__SDK__ = SDK;
  </script>
</body>
</html>
